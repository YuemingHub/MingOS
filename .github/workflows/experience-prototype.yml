name: Validate Living Interface

on:
  pull_request:
    paths:
      - 'web/prototype-v1/**'
      - '.github/workflows/experience-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright without changing repository manifests
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8080 > /tmp/mingos-prototype-http.log 2>&1 &
          echo $! > /tmp/mingos-prototype-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/web/prototype-v1/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mingos-prototype-http.log
          exit 1
      - name: Run desktop/mobile browser audit
        run: node web/prototype-v1/visual-audit.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mingos-living-interface-v1-visual-audit
          path: artifacts/living-interface-v1/
          if-no-files-found: error
          retention-days: 14
