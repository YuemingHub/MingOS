# ============================================================
# mingos.cn — Stage B · HTTPS Final
# 证书已经通过 certbot webroot 签发后才启用本配置。
# （证书获取流程见 DEPLOY.md Stage A → Stage B）
#
# 兼容性说明（HTTP/2）：
#   `http2 on;` 指令需要 nginx >= 1.25.1；`listen 443 ssl http2;`
#   写法在 nginx >= 1.9.5 可用但在 1.25.1+ 会产生 warning。
#   V0 站点仅 ~108KB，HTTP/2 非上线前提 —— 本配置默认不启用 HTTP/2。
#   部署时先 `nginx -v` 确认版本：
#     >= 1.25.1  → 在下面两个 443 server 里各加一行 `http2 on;`
#     1.9.5–1.25.0 → 把 `listen 443 ssl;` 改为 `listen 443 ssl http2;`
#     < 1.9.5   → 保持现状（HTTP/1.1 完全可用）
# ============================================================

# ---------- HTTP：ACME 续期 + 其余 301 到 HTTPS ----------
server {
    listen 80;
    server_name mingos.cn www.mingos.cn;

    # certbot renew（webroot）续期时仍需走 80
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://mingos.cn$request_uri;
    }
}

# www → apex（HTTPS 统一 canonical）
server {
    listen 443 ssl;
    server_name www.mingos.cn;

    ssl_certificate     /etc/letsencrypt/live/mingos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mingos.cn/privkey.pem;

    # 安全头在 www 跳转响应上也带上（add_header 不继承时也不丢）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://mingos.cn$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    server_name mingos.cn;

    root /var/www/mingos.cn;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/mingos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mingos.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ------------------------------------------------------------
    # 安全头。
    # 注意：nginx 的 add_header 继承语义是"location 内出现任何 add_header
    # 则整组替换"，因此每个带 Cache-Control 的 location 都必须重复这组头。
    # 修改任一 location 时务必保持。
    # ------------------------------------------------------------
    # HSTS 只在 HTTPS 响应上有意义；HTTP server 块不放。

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               image/svg+xml application/xml application/atom+xml;

    # HTML：协商缓存（文案更新立即生效）
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        # trailingSlash: true → 目录式路径优先命中 xx/index.html
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带 hash 的静态资源：长缓存 immutable（CSS 文件名含内容 hash）
    location /_next/static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 字体：URL 固定但内容随文案子集重建而变 → 协商缓存，不设长 max-age
    # （否则改一句文案重建字体后，老访客最长 30 天仍持有旧子集）
    location = /MingOS-Serif.woff2 {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 图标：短缓存
    location = /icon.svg {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # sitemap / robots：短缓存
    location = /sitemap.xml {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /robots.txt {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 站点没有 favicon.ico，指向 SVG 图标
    # （301 响应的安全头在下方 error_page/location 语义下同样补齐）
    location = /favicon.ico {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 301 /icon.svg;
    }

    error_page 404 /404.html;

    # 404 响应也带安全头（独立 location，避免被通用 location 的 add_header 覆盖丢失）
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
