# ============================================================
# mingos.cn — Stage A · HTTP Bootstrap
# 全新服务器第一次部署时使用：只提供 HTTP/80，不引用任何证书。
#
# 作用：
#   1. 提供 /.well-known/acme-challenge/（certbot webroot 验证）
#   2. 在拿到证书之前，临时以 HTTP 提供静态站
#
# 拿到证书后：换用 nginx.mingos.cn.conf（Stage B · HTTPS Final）。
# ============================================================

server {
    listen 80;
    server_name mingos.cn www.mingos.cn;

    root /var/www/mingos.cn;
    index index.html;

    # ACME webroot 验证（certbot -w /var/www/certbot 写入这里）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 临时 gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               image/svg+xml application/xml application/atom+xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
