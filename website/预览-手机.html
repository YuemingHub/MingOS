<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机预览 · mingos.cn 首页（390×844）</title>
<style>
  body{margin:0;background:#1a1c1d;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#c9cdd0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 12px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:#2b2f31;color:#e6e9ea;border:1px solid #3d4245;border-radius:999px;
    padding:7px 15px;font-size:13px;cursor:pointer}
  button[aria-pressed="true"]{background:#c9a96e;color:#171a1b;border-color:#c9a96e}
  .phone{width:390px;max-width:100%;background:#000;border-radius:30px;padding:10px;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  iframe{width:100%;height:844px;border:0;display:block;background:#0B1012;border-radius:22px}
  .tip{font-size:12px;color:#8b9195;max-width:520px;text-align:center;line-height:1.8}
</style>
</head>
<body>
  <div class="bar">
    <span style="font-size:13px">机型：</span>
    <button data-w="360" data-h="780">360×780</button>
    <button data-w="390" data-h="844" aria-pressed="true">390×844</button>
    <button data-w="430" data-h="932">430×932</button>
    <button data-w="768" data-h="1024">768 平板</button>
  </div>
  <div class="phone"><iframe id="f" src="index.html" title="mingos.cn 首页手机预览"></iframe></div>
  <p class="tip">这是把真实首页放进手机宽度的框里预览（同源 iframe，交互可用）。
  注意：这里看到的中文衬线字，就是你这台电脑实际会显示的字。换一台装了思源宋体/华文中宋的电脑，字会更厚。</p>
<script>
var f=document.getElementById('f'),btns=document.querySelectorAll('.bar button');
btns.forEach(function(b){b.addEventListener('click',function(){
  btns.forEach(function(x){x.removeAttribute('aria-pressed')});
  b.setAttribute('aria-pressed','true');
  f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px';
  document.querySelector('.phone').style.width=(+b.dataset.w+20)+'px';
})});
</script>
</body>
</html>
